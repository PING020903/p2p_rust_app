[package]
name = "p2p_rust_app"
version = "0.21.0"
edition = "2024"

[[bin]]
name = "p2p_rust_app"
path = "source/main.rs"

[workspace]
exclude = ["xtask"]

[dependencies]
argon2 = "0.5"
bip39 = { version = "2.0", features = ["rand"] }
chacha20poly1305 = "0.10"
colored = "2.0"
crc32fast = "1"
fnv = "1.0.7"
futures = "0.3.34"
hex = "0.4"
rand = "0.8"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "ping", "request-response", "cbor", "macros", "mdns", "gossipsub"] }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1.53.1", features = ["full"] }
eframe = "0.36.1"
egui = "0.36.1"
chrono = "0.4.45"

# target 瘦身：本体保留行号表（回溯带行号、可断点），依赖零调试信息
# （代价：无法单步进依赖库源码；收益：target 从 20GB+ 降至 GB 级、依赖重编更快）
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

