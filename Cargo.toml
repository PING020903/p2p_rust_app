[package]
name = "p2p_rust_app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "p2p_rust_app"
path = "source/main.rs"

[dependencies]
colored = "2.0"
fnv = "1.0.7"
futures = "0.3.34"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "ping", "request-response", "cbor", "macros", "mdns"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
