[package]
name = "p2p_rust_app"
version = "0.13.1"
edition = "2024"

[[bin]]
name = "p2p_rust_app"
path = "source/main.rs"

[dependencies]
argon2 = "0.5"
bip39 = { version = "2.0", features = ["rand"] }
chacha20poly1305 = "0.10"
colored = "2.0"
fnv = "1.0.7"
futures = "0.3.34"
hex = "0.4"
rand = "0.8"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "ping", "request-response", "cbor", "macros", "mdns", "gossipsub"] }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1.53.1", features = ["full"] }
